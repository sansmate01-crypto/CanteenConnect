<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartCanteen — Staff</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-3">
  <div class="container-fluid">
    <span class="navbar-brand">🍱 Canteen Dashboard</span>
    <span class="small text-white-50">{{ user_name }} ({{ role }}) · <a class="text-white-50" href="/logout">Log out</a></span>
  </div>
</nav>

<div class="container-fluid pb-5">
  <div id="alert"></div>
  <div class="row g-3" id="board"></div>
  <div class="text-muted small mt-3">Auto-refreshes every 3 seconds.</div>
</div>

<script>
const COLUMNS = [
  { key: 'NEW_ORDERS', title: 'New Orders', color: 'primary',   action: 'Start Preparing', path: 'start-preparing' },
  { key: 'PREPARING',  title: 'Preparing',  color: 'warning',   action: 'Mark Ready',      path: 'mark-ready' },
  { key: 'READY',      title: 'Ready',      color: 'success',   action: 'Verify QR & Collect', path: 'verify' },
  { key: 'COLLECTED',  title: 'Collected',  color: 'secondary', action: null }
];
const $ = id => document.getElementById(id);

function showAlert(msg, type = 'danger') {
  const d = document.createElement('div');
  d.className = `alert alert-${type}`;
  d.textContent = msg;
  $('alert').replaceChildren(d);
  setTimeout(() => d.remove(), 4000);
}

async function load() {
  const res = await fetch('/staff/dashboard');
  const data = await res.json();
  $('board').innerHTML = COLUMNS.map(c => {
    const orders = data[c.key] || [];
    return `<div class="col-md-3">
      <div class="card h-100">
        <div class="card-header bg-${c.color} ${c.color === 'warning' ? '' : 'text-white'} d-flex justify-content-between">
          <span>${c.title}</span><span class="badge bg-light text-dark">${orders.length}</span>
        </div>
        <div class="card-body">
          ${orders.length ? orders.map(o => `
            <div class="border rounded p-2 mb-2 bg-white">
              <div><strong>#${o.order_id}</strong> · ₹${o.total_amount}</div>
              <div class="small text-muted">Slot ${o.slot_id}</div>
              ${c.action ? `<button class="btn btn-sm btn-${c.color} mt-2"
                  onclick="act(${o.order_id}, '${c.path}')">${c.action}</button>` : ''}
            </div>`).join('') : '<div class="text-muted small">No orders</div>'}
        </div>
      </div></div>`;
  }).join('');
}

async function act(id, path) {
  let res;
  if (path === 'verify') {
    const token = prompt('Enter / scan the order QR token:');
    if (!token) return;
    res = await fetch(`/staff/orders/${id}/verify-qr`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ qr_token: token.trim() })
    });
  } else {
    res = await fetch(`/staff/orders/${id}/${path}`, { method: 'POST' });
  }
  const data = await res.json();
  if (!res.ok) showAlert(data.error || 'Action failed.');
  load();
}

load();
setInterval(load, 3000);
</script>
</body>
</html>
