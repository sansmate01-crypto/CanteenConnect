<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartCanteen — {{ 'Log in' if mode == 'login' else 'Sign up' }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width:420px">
  <div class="text-center my-4"><h3>🍱 SmartCanteen</h3></div>
  <div class="card"><div class="card-body">
    <h5 class="mb-3">{{ 'Log in' if mode == 'login' else 'Create student account' }}</h5>

    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

    <form method="post">
      {% if mode == 'register' %}
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input name="name" class="form-control" value="{{ name or '' }}" required>
      </div>
      {% endif %}
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input name="email" type="email" class="form-control" value="{{ email or '' }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input name="password" type="password" class="form-control" {% if mode == 'register' %}minlength="6"{% endif %} required>
      </div>
      <button class="btn btn-primary w-100">{{ 'Log in' if mode == 'login' else 'Sign up' }}</button>
    </form>

    <div class="text-center mt-3 small">
      {% if mode == 'login' %}
        New student? <a href="/register">Create an account</a>
      {% else %}
        Already registered? <a href="/login">Log in</a>
      {% endif %}
    </div>
  </div></div>
</div>
</body>
</html>
